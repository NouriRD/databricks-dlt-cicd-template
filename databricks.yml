bundle:
  name: databricks-dlt-cicd-template

targets:
  dev:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    mode: development
    default: true
  
  prod:
    mode: production
    workspace:
      host: https://your-prod-workspace.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  pipelines:
    dlt_pipeline:
      name: dlt_pipeline_${bundle.target}
      libraries:
        - notebook:
            path: ./notebooks/dlt_pipeline.py
      target: main
      continuous: false