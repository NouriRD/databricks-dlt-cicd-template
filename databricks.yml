bundle:
  name: databricks-dlt-cicd-template

targets:
  dev:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    mode: development
    default: true
  
  prod:
    mode: production

resources:
  pipelines:
    dlt_pipeline:
      name: dlt_pipeline
      libraries:
        - notebook:
            path: ./dlt_pipeline.py
      target: main.default
      continuous: false